type PtrToPtrOuter {
    name: String!
    inner: PtrToPtrInner
}

type PtrToPtrInner {
    key: String!
    value: String!
}

input UpdatePtrToPtrOuter {
    name: String
    inner: UpdatePtrToPtrInner
}

input UpdatePtrToPtrInner {
    key: String
    value: String
}

extend type Mutation {
    updatePtrToPtr(input: UpdatePtrToPtrOuter!): PtrToPtrOuter!
}
