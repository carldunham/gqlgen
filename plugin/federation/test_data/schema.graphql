type Hello @key(fields: "name") {
  name: String!
}

type World @key(fields: "foo bar") {
  foo: String!
  bar: Int!
}

extend type ExternalExtension @key(fields: "upc") {
    upc: String! @external
    reviews: [World]
    reviewsWith(input: ReviewInput): [World]
}

input ReviewInput {
    foo: String
}

type Query {
  hello: Hello!
  world: World!
}
